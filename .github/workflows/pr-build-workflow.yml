name: PR Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task + filter (empty = full build)'
        required: false
        default: ''

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '8'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
      - name: Build with Gradle
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew clean assemble ${{ inputs.test-filter }}
          else
            ./gradlew clean build --continue
          fi
      - name: Test results summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          from collections import defaultdict
          per = defaultdict(lambda: [0, 0, 0, 0])
          skipped = []
          def reason_for(cls, name):
              path = cls.replace('.', '/').split('$')[0] + '.java'
              for f in glob.glob('**/src/*/java/' + path, recursive=True):
                  lines = open(f, encoding='utf-8', errors='replace').read().splitlines()
                  for i, l in enumerate(lines):
                      if re.search(r'\b' + re.escape(name) + r'\s*\(', l):
                          for j in range(max(0, i - 6), i):
                              if '@Ignore' in lines[j]:
                                  return '%s (%s:%d)' % (lines[j].strip(), f, j + 1)
                  for j, l in enumerate(lines):
                      if '@Ignore' in l and 'class ' in ' '.join(lines[j:j + 3]):
                          return 'class-level %s (%s:%d)' % (l.strip(), f, j + 1)
              return 'no reason found in source'
          for x in glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True):
              mod = x.split('/build/test-results/')[0] or '.'
              r = ET.parse(x).getroot()
              for tc in r.iter('testcase'):
                  p = per[mod]
                  p[0] += 1
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      p[2] += 1
                  elif tc.find('skipped') is not None:
                      p[3] += 1
                      sk = tc.find('skipped')
                      msg = (sk.get('message') or '').strip() or reason_for(tc.get('classname'), tc.get('name'))
                      skipped.append('%s.%s: %s' % (tc.get('classname'), tc.get('name'), msg))
                  else:
                      p[1] += 1
          tot = [0, 0, 0, 0]
          for m in sorted(per):
              t, ok, fl, sk = per[m]
              print('TEST MODULE %s: %d tests, %d passed, %d failed, %d skipped' % (m, t, ok, fl, sk))
              tot = [a + b for a, b in zip(tot, per[m])]
          for s in skipped:
              print('SKIPPED TEST %s' % s)
          print('TEST SUMMARY | total=%d passed=%d failed=%d skipped=%d | skip reasons: %s' % (tot[0], tot[1], tot[2], tot[3], '; '.join(skipped) or 'none'))
          PY
      - name: Upload spring-security-core jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-security-core
          path: |
            core/build/libs/spring-security-core-*.jar
            !core/build/libs/*-sources.jar
            !core/build/libs/*-javadoc.jar
            !core/build/libs/*-tests.jar
            !core/build/libs/*-test.jar
          if-no-files-found: error
